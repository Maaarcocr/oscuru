name: Verify
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    name: Rendering engine tests (Core Image on macOS)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version
      - name: Engine tests (tables, colour, geometry, RAW decoding)
        run: swift test --package-path modules/oscuru-engine/native-tests
