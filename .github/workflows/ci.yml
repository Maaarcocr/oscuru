name: Verify
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Editing state, colour pipeline, filters, history, agent loop, OpenRouter client
        run: swift test --package-path ios/Packages/OscuruKit

  kit:
    name: Engine and scripting tests (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version
      - name: Core, Core Image engine (tables, colour, geometry, RAW decoding) and JavaScriptCore runtime
        run: swift test --package-path ios/Packages/OscuruKit
