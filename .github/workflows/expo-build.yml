name: Expo build

# Builds the iPhone app on Expo's servers (EAS Build) and, when asked, sends it to TestFlight.
# Manual, from main or any branch. Setup is in docs/expo.md. In short:
#   secret EXPO_TOKEN                       always
#   signing, one of:
#     a. Expo keeps the credentials        run `eas credentials` once on any computer
#     b. this repository supplies them     secrets APPLE_DISTRIBUTION_P12_BASE64,
#                                          APPLE_DISTRIBUTION_P12_PASSWORD, APPLE_APP_STORE_PROFILE_BASE64
#   TestFlight                              secrets ASC_PRIVATE_KEY_BASE64, ASC_KEY_ID, ASC_ISSUER_ID
#                                          and variable ASC_APP_ID
on:
  workflow_dispatch:
    inputs:
      profile:
        description: production is a TestFlight/App Store build; development is a development client for registered devices; simulator is for the iOS Simulator
        type: choice
        options: [production, development, simulator]
        default: production
        required: true
      submit:
        description: Send a production build to TestFlight when it finishes
        type: boolean
        default: true
      message:
        description: A note shown next to the build on expo.dev
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: expo-build
  cancel-in-progress: false

jobs:
  build:
    name: Build with EAS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      PROFILE: ${{ inputs.profile }}
      SUBMIT: ${{ inputs.submit }}
      MESSAGE: ${{ inputs.message }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      ASC_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
      APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
      APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      APPLE_APP_STORE_PROFILE_BASE64: ${{ secrets.APPLE_APP_STORE_PROFILE_BASE64 }}
    steps:
      - name: Check that an Expo token is configured
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens). See docs/expo.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - run: npm ci
      - name: Link the Expo project
        run: ./tools/link-eas-project.sh
      - name: Prepare signing and TestFlight credentials
        run: |
          set -euo pipefail
          mkdir -p credentials
          ARGS=(--platform ios --non-interactive --no-wait)
          [ -n "$MESSAGE" ] && ARGS+=(--message "$MESSAGE")
          BUILD_PROFILE="$PROFILE"
          if [ "$PROFILE" = production ] && [ -n "$APPLE_DISTRIBUTION_P12_BASE64" ] && [ -n "$APPLE_APP_STORE_PROFILE_BASE64" ]; then
            echo "Signing with the certificate and profile from this repository's secrets."
            printf '%s' "$APPLE_DISTRIBUTION_P12_BASE64" | base64 --decode > credentials/distribution.p12
            printf '%s' "$APPLE_APP_STORE_PROFILE_BASE64" | base64 --decode > credentials/appstore.mobileprovision
            node -e '
              const fs = require("fs");
              fs.writeFileSync("credentials.json", JSON.stringify({ ios: {
                provisioningProfilePath: "credentials/appstore.mobileprovision",
                distributionCertificate: { path: "credentials/distribution.p12", password: process.env.APPLE_DISTRIBUTION_P12_PASSWORD || "" },
              } }));
            '
            BUILD_PROFILE=production-local-credentials
          else
            echo "Signing with the credentials Expo keeps for this project."
          fi
          if [ "$PROFILE" = production ] && [ "$SUBMIT" = true ]; then
            if [ -z "$ASC_PRIVATE_KEY_BASE64" ] || [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_KEY_ISSUER_ID" ] || [ -z "$ASC_APP_ID" ]; then
              echo "::error::To send builds to TestFlight, set secrets ASC_PRIVATE_KEY_BASE64, ASC_KEY_ID, ASC_ISSUER_ID and variable ASC_APP_ID, or run again with submit off. See docs/expo.md."
              exit 1
            fi
            printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > credentials/asc-api-key.p8
            echo "ASC_API_KEY_PATH=$PWD/credentials/asc-api-key.p8" >> "$GITHUB_ENV"
            # The App Store Connect app id is not a secret, but eas.json has no placeholder for it.
            node -e '
              const fs = require("fs");
              const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
              eas.submit.production.ios.ascAppId = process.env.ASC_APP_ID;
              fs.writeFileSync("eas.json", JSON.stringify(eas, null, 2));
            '
            ARGS+=(--auto-submit-with-profile production)
          fi
          ARGS+=(--profile "$BUILD_PROFILE")
          printf '%s\n' "${ARGS[@]}" > credentials/eas-build-args
      - name: Start the build
        run: |
          set -euo pipefail
          mapfile -t ARGS < credentials/eas-build-args
          eas build "${ARGS[@]}"
          echo "::notice::The build is running on Expo's servers. Follow it at https://expo.dev (Projects → oscuru → Builds)."
      - name: Remove signing material
        if: always()
        run: rm -rf credentials credentials.json
