name: Expo build

# Builds the iPhone app on Expo's servers (EAS Build) and sends it to TestFlight.
# Manual. One-time setup is in docs/expo.md: the EXPO_TOKEN secret, signing credentials kept by
# Expo (`eas credentials`, once, on any computer), and an App Store Connect API key for TestFlight.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Send the build to TestFlight when it finishes
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: expo-build
  cancel-in-progress: false

jobs:
  build:
    name: Build with EAS
    # macOS only to run XcodeGen: the build itself happens on Expo's servers.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SUBMIT: ${{ inputs.submit }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      ASC_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
    steps:
      - name: Check the Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens). See docs/expo.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          (cd ios && xcodegen generate)
      - name: Link the Expo project
        run: |
          if ! node -e 'process.exit(require("./app.json").expo?.extra?.eas?.projectId ? 0 : 1)'; then
            npx --yes eas-cli@latest init --force --non-interactive
            echo "::notice::Expo project id: $(node -p 'require("./app.json").expo.extra.eas.projectId'). Commit it in app.json (expo.extra.eas.projectId)."
          fi
      - name: Build, and send to TestFlight
        run: |
          set -euo pipefail
          ARGS=(--platform ios --profile production --non-interactive --no-wait)
          if [ "$SUBMIT" = true ]; then
            if [ -z "$ASC_PRIVATE_KEY_BASE64" ] || [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_KEY_ISSUER_ID" ] || [ -z "$ASC_APP_ID" ]; then
              echo "::error::To send builds to TestFlight, set secrets ASC_PRIVATE_KEY_BASE64, ASC_KEY_ID, ASC_ISSUER_ID and variable ASC_APP_ID, or run again with submit off. See docs/expo.md."
              exit 1
            fi
            mkdir -p credentials
            printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > credentials/asc-api-key.p8
            export ASC_API_KEY_PATH="$PWD/credentials/asc-api-key.p8"
            node -e '
              const fs = require("fs");
              const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
              eas.submit.production.ios.ascAppId = process.env.ASC_APP_ID;
              fs.writeFileSync("eas.json", JSON.stringify(eas, null, 2));
            '
            ARGS+=(--auto-submit)
          fi
          npx --yes eas-cli@latest build "${ARGS[@]}"
          echo "::notice::The build is running on Expo's servers. Follow it on expo.dev (Projects → oscuru → Builds)."
      - name: Remove signing material
        if: always()
        run: rm -rf credentials
