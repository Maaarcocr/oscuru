name: Expo update

# Publishes the JavaScript side of the app as an over-the-air update (EAS Update). Installed builds
# pick it up the next time they start, as long as their native side is the same as this commit's
# (the runtime version is a fingerprint of the native project). Native changes need a new build.
#
# Runs on every push to main, and by hand for any branch. Without the EXPO_TOKEN secret it does nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: The channel to publish to (production builds listen to production)
        type: choice
        options: [production, development, preview]
        default: production
        required: true

permissions:
  contents: read

concurrency:
  group: expo-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish an over-the-air update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      CHANNEL: ${{ inputs.channel || 'production' }}
    steps:
      - name: Check that an Expo token is configured
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::No EXPO_TOKEN secret, so nothing was published. See docs/expo.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.ready == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - name: Install, test and publish
        if: steps.token.outputs.ready == 'true'
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          ./tools/link-eas-project.sh
          eas update --channel "$CHANNEL" --environment production --platform ios --non-interactive \
            --message "$(git log -1 --pretty=%s)"
